{% extends "base.html" %}


{% block title %}
    Login
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-4">

        <div class="card card-primary card-outline">

            <div class="card-header text-center">

                <h3 class="card-title float-none">
                    Login
                </h3>

            </div>


            <div class="card-body">


                {% if form.errors %}

                    <div class="alert alert-danger">

                        Invalid username or password.

                    </div>

                {% endif %}


                <form
                    method="post"
                    autocomplete="off"
                >

                    {% csrf_token %}


                    <div class="mb-3">

                        <label
                            for="{{ form.username.id_for_label }}"
                            class="form-label"
                        >
                            Username
                        </label>


                        {{ form.username }}

                    </div>


                    <div class="mb-3">

                        <label
                            for="{{ form.password.id_for_label }}"
                            class="form-label"
                        >
                            Password
                        </label>


                        {{ form.password }}

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >

                        <i class="bi bi-box-arrow-in-right me-1"></i>

                        Login

                    </button>


                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
