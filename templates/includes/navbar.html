{% load static %}

<nav class="app-header navbar navbar-expand bg-body border-bottom shadow-sm">
    <div class="container-fluid">
        <!-- Left Navbar -->
        <ul class="navbar-nav align-items-center">
            <!-- Theme Toggle -->
            <li class="nav-item">
                <button
                    type="button"
                    class="nav-link border-0 bg-transparent rounded-circle"
                    id="theme-toggle"
                    aria-label="Toggle theme"
                    title="Toggle theme"
                >
                    <i
                        class="bi bi-moon-fill"
                        id="theme-icon"
                    ></i>
                </button>
            </li>
            <!-- Sidebar Toggle -->
            <li class="nav-item">
                <a
                    class="nav-link rounded"
                    data-lte-toggle="sidebar"
                    href="#"
                    role="button"
                    aria-label="Toggle sidebar"
                    title="Toggle sidebar"
                >
                    <i class="bi bi-list fs-5"></i>
                </a>
            </li>
            <!-- Home -->
            <li class="nav-item d-none d-md-block">
                <a
                    href="{% url 'dashboard' %}"
                    class="nav-link fw-medium"
                >
                    <i class="bi bi-house-door me-1"></i>
                    Home
                </a>
            </li>
        </ul>
        <!-- Navbar Search -->
        <form
            class="d-none d-md-flex ms-3"
            role="search"
            action="search-results.html"
        >
            <label
                for="navbar-search-input"
                class="visually-hidden"
            >
                Search
            </label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-body border-end-0">
                    <i class="bi bi-search text-body-secondary"></i>
                </span>
                <input
                    type="search"
                    id="navbar-search-input"
                    name="q"
                    class="form-control border-start-0 shadow-none"
                    placeholder="Search..."
                    autocomplete="off"
                >
            </div>
        </form>
        <!-- Right Navbar -->
        <ul class="navbar-nav ms-auto align-items-center">
            <!-- Search on Small Screens -->
            <li class="nav-item d-md-none">
                <a
                    class="nav-link rounded-circle"
                    href="search-results.html"
                    aria-label="Search"
                    title="Search"
                >
                    <i class="bi bi-search"></i>
                </a>
            </li>
            {% if user.is_authenticated %}
                <!-- User Menu -->
                <li class="nav-item dropdown">
                    <a
                        class="nav-link dropdown-toggle d-flex align-items-center px-2"
                        href="#"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        <img
                            src="{% static 'adminlte/img/user1-128x128.jpg' %}"
                            class="rounded-circle shadow-sm border me-2"
                            width="34"
                            height="34"
                            alt="User profile"
                        >
                        <span class="d-none d-md-inline fw-medium">
                            {{ user.get_username }}
                        </span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 overflow-hidden">
                        <!-- User Header -->
                        <li>
                            <div class="bg-primary-subtle text-primary p-3">
                                <div class="text-center">
                                    <img
                                        src="{% static 'adminlte/img/user1-128x128.jpg' %}"
                                        class="rounded-circle shadow-sm border border-2"
                                        width="70"
                                        height="70"
                                        alt="User profile"
                                    >
                                    <p class="mb-0 mt-2 fw-semibold text-body">
                                        {{ user.get_username }}
                                    </p>
                                    {% if user.is_staff %}
                                        <small class="text-body-secondary">
                                            <i class="bi bi-shield-check me-1"></i>
                                            Administrator
                                        </small>
                                    {% endif %}
                                </div>
                            </div>
                        </li>
                        <!-- Profile -->
                        <li>
                            <a
                                href="{% url 'admin_profile' %}"
                                class="dropdown-item py-2"
                            >
                                <i class="bi bi-person text-primary me-2"></i>
                                Profile
                            </a>
                        </li>
                        <!-- Settings -->
                        <li>
                            <a
                                href="{% url 'user_setting' %}"
                                class="dropdown-item py-2"
                            >
                                <i class="bi bi-gear text-secondary me-2"></i>
                                Settings
                            </a>
                        </li>
                        <li>
                            <hr class="dropdown-divider my-1">
                        </li>
                        <!-- Logout -->
                        <li>
                            <form
                                method="post"
                                action="{% url 'logout' %}"
                            >
                                {% csrf_token %}
                                <button
                                    type="submit"
                                    class="dropdown-item py-2 text-secondary"
                                >
                                    <i class="bi bi-box-arrow-right me-2"></i>
                                    Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            {% else %}
                <!-- Login -->
                <li class="nav-item">
                    <a
                        href="{% url 'login' %}"
                        class="nav-link d-flex align-items-center"
                    >
                        <i class="bi bi-box-arrow-in-right text-primary me-1"></i>
                        <span class="d-none d-sm-inline">
                            Public Login
                        </span>
                    </a>
                </li>
            {% endif %}
        </ul>
    </div>
</nav>
