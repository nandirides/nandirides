{% load static %}

<nav class="app-header navbar navbar-expand bg-body">

    <div class="container-fluid">


        <!-- Left Navbar -->
        <ul class="navbar-nav">
<button
    type="button"
    class="nav-link border-0 bg-transparent"
    id="theme-toggle"
>
    <i
        class="bi bi-moon-fill"
        id="theme-icon"
    ></i>
</button>
            <!-- Sidebar Toggle -->
            <li class="nav-item">

                <a
                    class="nav-link"
                    data-lte-toggle="sidebar"
                    href="#"
                    role="button"
                    aria-label="Toggle sidebar"
                >

                    <i class="bi bi-list"></i>

                </a>

            </li>


            <!-- Home -->
            <li class="nav-item d-none d-md-block">

                <a
                    href="{% url 'dashboard' %}"
                    class="nav-link"
                >
                    Home
                </a>

            </li>

        </ul>


        <!-- Right Navbar -->
        <ul class="navbar-nav ms-auto">


            <!-- Dark Mode -->
            <li class="nav-item">

                <button
                    type="button"
                    class="nav-link border-0 bg-transparent"
                    id="theme-toggle"
                    title="Toggle dark mode"
                    aria-label="Toggle dark mode"
                >

                    <i
                        class="bi bi-moon-fill"
                        id="theme-icon"
                    ></i>

                </button>

            </li>


            {% if user.is_authenticated %}


                <!-- User Menu -->
                <li class="nav-item dropdown">

                    <a
                        class="nav-link dropdown-toggle d-flex align-items-center"
                        href="#"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >

                        <img
                            src="{% static 'adminlte/img/user1-128x128.jpg' %}"
                            class="user-image rounded-circle shadow me-2"
                            width="32"
                            height="32"
                            alt="User profile"
                        >

                        <span class="d-none d-md-inline">
                            {{ user.get_username }}
                        </span>

                    </a>


                    <ul class="dropdown-menu dropdown-menu-end">


                        <!-- User Header -->
                        <li class="user-header text-bg-primary p-3">

                            <div class="text-center">

                                <img
                                    src="{% static 'adminlte/img/user1-128x128.jpg' %}"
                                    class="rounded-circle shadow"
                                    width="64"
                                    height="64"
                                    alt="User profile"
                                >

                                <p class="mb-0 mt-2">

                                    {{ user.get_username }}

                                    {% if user.is_staff %}
                                        <small>
                                            Administrator
                                        </small>
                                    {% endif %}

                                </p>

                            </div>

                        </li>


                        <!-- Profile -->
                        <li>

                            <a
                                href="#"
                                class="dropdown-item"
                            >

                                <i class="bi bi-person me-2"></i>

                                Profile

                            </a>

                        </li>


                        <!-- Settings -->
                        <li>

                            <a
                                href="#"
                                class="dropdown-item"
                            >

                                <i class="bi bi-gear me-2"></i>

                                Settings

                            </a>

                        </li>


                        <li>
                            <hr class="dropdown-divider">
                        </li>


                        <!-- Logout -->
                        <li>

                            <form
                                method="post"
                                action="{% url 'logout' %}"
                            >

                                {% csrf_token %}

                                <button
                                    type="submit"
                                    class="dropdown-item text-danger"
                                >

                                    <i class="bi bi-box-arrow-right me-2"></i>

                                    Logout

                                </button>

                            </form>

                        </li>


                    </ul>

                </li>


            {% else %}


                <!-- Login -->
                <li class="nav-item">

                    <a
                        href="{% url 'login' %}"
                        class="nav-link"
                    >

                        <i class="bi bi-box-arrow-in-right me-1"></i>

                        Login

                    </a>

                </li>


            {% endif %}


        </ul>

    </div>

</nav>
