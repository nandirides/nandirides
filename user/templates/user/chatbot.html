<!-- NandiRide Chatbot -->
<div id="chatbotWindow" class="position-fixed bottom-0 end-0 m-3 d-none" style="width:min(390px,calc(100vw - 30px));z-index:1054;">
    <div class="card border-0 shadow-lg overflow-hidden rounded-4">
        <!-- Chatbot Header -->
        <div class="bg-danger text-white p-3">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="bg-white text-danger rounded-circle d-flex align-items-center justify-content-center me-3" style="width:48px;height:48px;">
                        <i class="fa-solid fa-car-side fs-5"></i>
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold">Nandi<span class="text-warning">Ride</span></h6>
                        <small class="text-white-50">
                            <i class="fa-solid fa-circle text-success me-1" style="font-size:8px;"></i>
                            Ride Assistant
                        </small>
                    </div>
                </div>
                <button type="button" id="closeChatbot" class="btn btn-sm text-white border-0 shadow-none">
                    <i class="fa-solid fa-xmark fs-5"></i>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatMessages" class="bg-light p-3 overflow-auto" style="height:360px;">
            <div class="d-flex align-items-start mb-3">
                <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 me-2" style="width:36px;height:36px;">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-white shadow-sm rounded-4 rounded-top-start-0 px-3 py-2">
                    <p class="mb-1 small fw-semibold">Hello! 👋</p>
                    <p class="mb-0 small text-secondary">Welcome to NandiRide. How can I help you today?</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="mt-3">
                <p class="small fw-bold text-dark mb-2">Quick Actions</p>
                <div class="row g-2">
                    <div class="col-6">
                        <a href="{% url 'booking' %}" class="btn btn-white border shadow-sm w-100 text-start rounded-3 p-2 chatbot-action">
                            <i class="fa-solid fa-taxi text-danger me-2"></i>
                            <span class="small fw-semibold">Book Ride</span>
                        </a>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-white border shadow-sm w-100 text-start rounded-3 p-2 chatbot-action" onclick="sendBotMessage('Fare Estimate')">
                            <i class="fa-solid fa-indian-rupee-sign text-danger me-2"></i>
                            <span class="small fw-semibold">Fare Estimate</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <a href="{% url 'track' %}" class="btn btn-white border shadow-sm w-100 text-start rounded-3 p-2 chatbot-action">
                            <i class="fa-solid fa-location-dot text-danger me-2"></i>
                            <span class="small fw-semibold">Track Ride</span>
                        </a>
                    </div>
                    <div class="col-6">
                        <a href="{% url 'cancel-ride' %}" class="btn btn-white border shadow-sm w-100 text-start rounded-3 p-2 chatbot-action">
                            <i class="fa-solid fa-ban text-danger me-2"></i>
                            <span class="small fw-semibold">Cancel Ride</span>
                        </a>
                    </div>
                    <div class="col-6">
                        <a href="{% url 'myride' %}" class="btn btn-white border shadow-sm w-100 text-start rounded-3 p-2 chatbot-action">
                            <i class="fa-solid fa-clock-rotate-left text-danger me-2"></i>
                            <span class="small fw-semibold">My Rides</span>
                        </a>
                    </div>
                    <div class="col-6">
                        <a href="{% url 'payment' %}" class="btn btn-white border shadow-sm w-100 text-start rounded-3 p-2 chatbot-action">
                            <i class="fa-solid fa-credit-card text-danger me-2"></i>
                            <span class="small fw-semibold">Payment</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="bg-white border-top p-2">
            <form id="chatForm" class="d-flex align-items-center gap-2">
                <input type="text" id="chatInput" class="form-control border-0 bg-light rounded-pill px-3 shadow-none" placeholder="Type your message..." autocomplete="off">
                <button type="submit" class="btn btn-danger rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width:42px;height:42px;">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>
