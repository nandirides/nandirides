{% extends 'user/dashboard_base.html' %}
{% block page_heading %}
Track
{% endblock %}

{% block dashboard_content %}

<div class="card border-0 shadow-sm">

    <div class="card-body">

        <h5 class="mb-4">
            Track
        </h5>

        <!-- Ride data-->

        <div class="alert alert-danger">
            Track will appear here.
        </div>

    </div>

</div>


    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <span><a href="#" class="lbtn btn-primary rounded-pill fw-bold">Login</a></span>
            </div>
        {% endfor %}
    {% endif %}
{% endblock %}
