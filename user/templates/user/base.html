<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Nandi Rides Booking Portal {% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }
        header {
            background: #d32f2f;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background: #b71c1c;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #d32f2f;
            color: white;
            border: none;
            cursor: pointer;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background: #b71c1c;
        }
        footer {
            background: #d32f2f;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
    {% comment %} <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"> {% endcomment %}
</head>
<body>

    <header>
        <h1>Welcome to Nandi Rides Booking Portal
            
                               
                                    <span>
                                         <a href="/login/" class="btn">SignUp</a></span>
                                         <span>
                                         <a href="/login/" class="btn">Login</a></span>
                                    
                           
        </h1>
        <p>Book your Nandi Rides anytime, anywhere</p>
        
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="#">Book rides</a>
        <a href="#">Booking Status</a>
        <a href="#">Contact Us</a>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
