<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dc3545">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'user/css/style.css' %}">
    <title>{% block title %}Nandi Rides Booking Portal{% endblock %}</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-light pt-1">
    {% include "partials/navbar.html" %}

<main class="flex-grow-1 w-100 px-2 px-sm-3 px-md-2 pt-5 mt-4 app-main">
    {% include "partials/message.html" %}
    {% block content %}
    {% endblock %}
</main>
{% include "partials/footer.html" %}

<!-- NandiRide Help Chatbot -->
<div id="chatbotButton" class="position-fixed bottom-0 end-0 m-3" style="z-index:1055;">
    <button type="button" class="btn btn-danger rounded-circle shadow-lg d-flex align-items-center justify-content-center" id="openChatbot" aria-label="Open NandiRide help chatbot" style="width:60px;height:60px;">
        <i class="fa-solid fa-comments fs-4"></i>
    </button>
</div>
<script>
    const chatbotUrls = {
        booking: "{% url 'booking' %}",
        track: "{% url 'track' %}",
        cancel: "{% url 'cancel-ride' %}",
        myride: "{% url 'myride' %}",
        payment: "{% url 'payment' %}",
        paymentdetails: "{% url 'paymentdetails' %}",
        paymentreceipt: "{% url 'paymentreceipt' %}"
    };
</script>
{% include 'user/chatbot.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'user/js/scripts.js' %}"></script>
</body>
</html>
